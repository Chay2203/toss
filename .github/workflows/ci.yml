name: Test, build, scan and deploy
on:
  pull_request:
  push:
    branches: [main, devorps]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: 22.23.3}
      - name: Check and test
        run: npm ci --ignore-scripts && npm run check && npm test
      - name: Check history for secrets
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --exit-code 1
      - name: Build and vulnerability scan
        run: |
          docker build --build-arg VERSION="$GITHUB_SHA" -t "coin-toss:$GITHUB_SHA" .
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.69.3 image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 "coin-toss:$GITHUB_SHA"
      - name: Deploy automatically to a temporary Kubernetes cluster
        run: |
          bash scripts/bootstrap.sh
          bash scripts/up.sh
      - name: Verify working user journey and capture evidence
        run: |
          bash scripts/access.sh > .runtime/access.log 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:3000/readyz && break || sleep 1; done
          bash scripts/ops.sh evidence
          docker save "coin-toss:$GITHUB_SHA" | gzip > .runtime/coin-toss-image.tar.gz
          (cd .runtime && sha256sum coin-toss-image.tar.gz > image.sha256)
      - name: Save evidence and deployable image
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coin-toss-${{ github.sha }}
          path: |
            evidence/runs/
            .runtime/coin-toss-image.tar.gz
            .runtime/image.sha256
          include-hidden-files: true
          retention-days: 14
      - name: Clean temporary cluster
        if: always()
        run: .tools/kind delete cluster --name coin-toss || true
