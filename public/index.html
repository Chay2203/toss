<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coin Toss</title><link rel="stylesheet" href="/style.css"></head>
<body><main><div class="eyebrow">A LITTLE CHANCE. A CLEAR ANSWER.</div><h1>Leave it to the coin.</h1><p class="intro">Two sides. One simple decision.</p><div id="coin" aria-hidden="true">?</div><h2 id="result" aria-live="polite">Ready when you are.</h2><p id="status" role="status">Give it a toss and see where it lands.</p><button id="toss">Toss Coin <span aria-hidden="true">↗</span></button><section aria-label="Session results"><div><strong id="heads">0</strong><span>HEADS</span></div><div><strong id="tails">0</strong><span>TAILS</span></div><div><strong id="total">0</strong><span>TOSSES</span></div></section><p class="note">Your counts stay in this tab and reset on refresh.</p><footer><span class="dot"></span> Coin Toss <span id="version">Connecting…</span></footer></main><script src="/app.js" defer></script></body></html>
