apiVersion: v1
kind: Namespace
metadata:
  name: coin-toss
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.35
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coin-toss
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coin-toss
spec:
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: coin-toss}
  template:
    metadata:
      labels: {app: coin-toss}
    spec:
      serviceAccountName: coin-toss
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: coin-toss:local
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 3000}]
          envFrom: [{configMapRef: {name: coin-config}}]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: coin-toss
spec:
  type: ClusterIP
  selector: {app: coin-toss}
  ports: [{name: http, port: 3000, targetPort: http}]
